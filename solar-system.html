<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Simulation</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
        }

        canvas {
            display: block;
        }

        #recordingStatus {
            position: absolute;
            top: 10px;
            right: 10px;
            color: red;
            font-size: 20px;
            display: none;
            font-family: Arial, sans-serif;
        }

        #backButton {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-family: Arial, sans-serif;
            transition: background 0.3s ease;
        }

        #backButton:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>
    <button id="backButton" onclick="window.location.href='index.html'">← Back to Simulations</button>
    <div id="recordingStatus">● Recording</div>
    <script type="module" src="./js/main.js"></script>
</body>
</html>
